name: Landing site CI

on:
  push:
    branches:
      - main
      - feature/landing-seo-geo
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
  workflow_dispatch:

jobs:
  verify-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run source contract tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Verify generated artifacts
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/llms.txt
          test -f dist/sitemap-index.xml
          grep -q 'application/ld+json' dist/index.html
          grep -q 'rel="canonical"' dist/index.html
